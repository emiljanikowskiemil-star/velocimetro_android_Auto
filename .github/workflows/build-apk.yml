
    
  
          try:
              with zipfile.ZipFile(source, 'r') as zin, zipfile.ZipFile(temp, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for info in zin.infolist():
                      data = zin.read(info.filename)
                      if info.filename.endswith('/values/ids.xml') or info.filename == 'res/values/ids.xml':
                          root = ET.fromstring(data)
                          changed = 0
                          for item in root.iter('item'):
                              if item.get('type') == 'id':
                                  for child in list(item):
                                      item.remove(child)
                                  item.text = None
                                  changed += 1
                          if changed:
                              data = ET.tostring(root, encoding='utf-8', xml_declaration=True)
                              patched_files += 1
                              patched_items += changed
                      zout.writestr(info, data)

              if patched_files == 0 or patched_items == 0:
                  raise SystemExit('Nie znaleziono wadliwych wpisów ID w AAR; przerywam, aby nie budować z niezmienioną biblioteką.')

              target.parent.mkdir(parents=True, exist_ok=True)
              temp.replace(target)
              print(f'Naprawiono {patched_items} wpisów ID w {patched_files} pliku(ach).')
          finally:
              if temp.exists():
                  temp.unlink()
          PY

          unzip -t app/libs/aauto-sdk-fixed.aar

          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          content = path.read_text(encoding='utf-8')
          old = "implementation files('libs/aauto.aar')"
          new = "implementation files('libs/aauto-sdk-fixed.aar')"
          if old in content:
              path.write_text(content.replace(old, new), encoding='utf-8')
              print('Ustawiono zależność na naprawiony lokalny plik AAR.')
          elif new in content:
              print('Zależność na naprawiony AAR jest już ustawiona.')
          else:
              raise SystemExit('Nie znaleziono oczekiwanej zależności aauto.aar w app/build.gradle.')
          PY

